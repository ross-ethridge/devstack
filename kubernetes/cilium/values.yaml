kubeProxyReplacement: true
k8sServiceHost: 127.0.0.1
k8sServicePort: 6443
ipam:
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.42.0.0/16

# Single-node cluster (Rancher Desktop) — the default of 2 replicas relies on
# pod anti-affinity across nodes, so the 2nd replica sits Pending forever.
operator:
  replicas: 1

hubble:
  ui:
    enabled: true
  relay:
    enabled: true
