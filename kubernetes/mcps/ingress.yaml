apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-mcp-prefix
spec:
  stripPrefix:
    prefixes:
      - /mcp-kubernetes
      - /mcp-kubectl
      - /mcp-playwright
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-servers
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: mcp-servers-strip-mcp-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /mcp-kubernetes
            pathType: Prefix
            backend:
              service:
                name: mcp-kubernetes
                port:
                  number: 3001
          - path: /mcp-kubectl
            pathType: Prefix
            backend:
              service:
                name: mcp-kubectl
                port:
                  number: 8000
          - path: /mcp-playwright
            pathType: Prefix
            backend:
              service:
                name: mcp-playwright
                port:
                  number: 3001
