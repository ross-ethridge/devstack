apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-cluster-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-cluster-admin
subjects:
  - kind: ServiceAccount
    name: mcp-cluster-admin
    namespace: mcp-servers
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
