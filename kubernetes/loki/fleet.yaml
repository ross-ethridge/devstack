defaultNamespace: loki

helm:
  releaseName: loki
  repo: https://grafana.github.io/helm-charts
  chart: loki
  version: 7.2.0
  createNamespace: true
  # values.yaml uses ${ACCESS_KEY_ID}/${SECRET_ACCESS_KEY} for Loki's own
  # -config.expand-env=true - not for Fleet's Go-template preprocessing
  # (which also uses ${} and would otherwise eat them first).
  disablePreProcess: true
  valuesFiles:
    - values.yaml
